workflows:
  android-development:
    name: Money Manager Android Development Build

    environment:
      node: 20.19.0
      java: 17
      vars:
        EXPO_NO_DOCTOR: "1"

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Install EAS CLI
        script: |
          npm install -g eas-cli

      - name: Build Android development APK
        script: |
          eas build --platform android --profile development --non-interactive

    artifacts:
      - "*.apk"
      - "build/**/*.apk"
      - "android/**/*.apk"